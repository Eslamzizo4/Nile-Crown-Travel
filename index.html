<script>
const SUPABASE_URL =
  "https://vlqzmqbshqxycwgiuov.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2kdCMej4UhbTlmEcrqIoRg_nDGXvSeL";


async function loadPrices() {

  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/trips?select=*",
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const trips = await response.json();

    console.log("SUPABASE TRIPS:", trips);


    document.querySelectorAll("[data-trip-id]").forEach(card => {

      const type =
        card.getAttribute("data-trip-id");

      let trip = null;


      if (type === "luxor") {

        trip = trips.find(t => {

          const title =
            String(t.title_en || "").toLowerCase();

          return (
            title.includes("luxor") ||
            title.includes("aswan")
          );

        });

      }


      if (type === "cruise") {

        trip = trips.find(t => {

          const title =
            String(t.title_en || "").toLowerCase();

          return (
            title.includes("cruise") ||
            title.includes("nile")
          );

        });

      }


      if (type === "cairo") {

        trip = trips.find(t => {

          const title =
            String(t.title_en || "").toLowerCase();

          return (
            title.includes("cairo") ||
            title.includes("historic")
          );

        });

      }


      if (type === "redsea") {

        trip = trips.find(t => {

          const title =
            String(t.title_en || "").toLowerCase();

          return (
            title.includes("red sea") ||
            title.includes("redsea")
          );

        });

      }


      if (trip) {

        const price =
          card.querySelector(".price");

        if (price && trip.price_en) {

          price.textContent =
            String(trip.price_en).trim();

        }

      }

    });

  } catch (error) {

    console.error(
      "PRICE ERROR:",
      error
    );

  }

}


/* WHATSAPP CONTACT FORM */

function sendForm(e) {

  e.preventDefault();

  const name =
    document.getElementById("name")
      .value.trim();

  const email =
    document.getElementById("email")
      .value.trim();

  const trip =
    document.getElementById("trip")
      .value ||
      "Not specified";

  const message =
    document.getElementById("message")
      .value.trim() ||
      "No additional message";


  const text =
`Hello Nile Crown Travel,

Name: ${name}
Email: ${email}
Trip: ${trip}
Message: ${message}`;


  window.open(
    "https://wa.me/201010575983?text=" +
    encodeURIComponent(text),
    "_blank"
  );

}


/* START */

document.addEventListener(
  "DOMContentLoaded",
  loadPrices
);
</script>
