<style>
*{box-sizing:border-box}

body{

.wrap{

header{

h1{

h2{

.kicker{

  background:#fffdf8;

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

label{
  font-size:14px;
  color:#555;
}

input,
textarea{
  display:block;
  width:100%;
  margin-top:7px;
  padding:13px;
  border:1px solid #d7c8aa;
  border-radius:10px;
  font:inherit;
  background:white;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.price input{
  border:2px solid #b99b55;
  background:#fffaf0;
  font-weight:bold;
  font-size:17px;
}

.btn{
  padding:12px 20px;
  border-radius:10px;
  border:1px solid #d7c8aa;
  background:#fffdf8;
  cursor:pointer;
  text-decoration:none;
  color:#17211d;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#1d3028;
  color:white;
  border-color:#1d3028;
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:18px;
}

.note{
  color:#666;
  font-size:14px;
  line-height:1.6;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#eee6d5;
  font-size:12px;
  font-weight:bold;
}

#status{
  margin-top:15px;
  font-weight:bold;
  line-height:1.6;
}

.loading{
  text-align:center;
  color:#666;
}

.success{
  color:green;
}

.error{
  color:#b00020;
}

@media(max-width:700px){

  header{
    flex-direction:column;
    align-items:flex-start;
    gap:15px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  h1{
    font-size:32px;
  }

}
</style>
</head>

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showStatus(message,type=""){

  const status =

}
