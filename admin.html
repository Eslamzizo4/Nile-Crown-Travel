<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nile Crown Travel - Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5efe3;
  color:#17211d;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:1100px;
  margin:40px auto;
  padding:20px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

h1{font-size:40px;margin:5px 0}
h2{margin-top:0}

.kicker{
  font-size:13px;
  font-weight:bold;
  letter-spacing:2px;
  color:#8d7040;
  text-transform:uppercase;
}

.card{
  background:#fffdf8;
  border:1px solid #d7c8aa;
  border-radius:18px;
  padding:24px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

label{
  font-size:14px;
  color:#555;
}

input,textarea{
  display:block;
  width:100%;
  margin-top:7px;
  padding:13px;
  border:1px solid #d7c8aa;
  border-radius:10px;
  font:inherit;
  background:white;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.price input{
  border:2px solid #b99b55;
  background:#fffaf0;
  font-weight:bold;
  font-size:17px;
}

.btn{
  padding:12px 20px;
  border-radius:10px;
  border:1px solid #d7c8aa;
  background:#fffdf8;
  cursor:pointer;
  text-decoration:none;
  color:#17211d;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#1d3028;
  color:white;
  border-color:#1d3028;
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:18px;
}

.note{
  color:#666;
  font-size:14px;
  line-height:1.6;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#eee6d5;
  font-size:12px;
  font-weight:bold;
}

#status{
  margin-top:15px;
  font-weight:bold;
  line-height:1.6;
}

.loading{
  text-align:center;
  color:#666;
}

.success{
  color:green;
}

.error{
  color:#b00020;
}

@media(max-width:700px){
  header{
    flex-direction:column;
    align-items:flex-start;
    gap:15px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  h1{font-size:32px}
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div>
    <div class="kicker">Nile Crown Travel</div>

    <h1>Admin Dashboard</h1>

    <p class="note">
      Edit your trips and prices, then press Save changes.
    </p>
  </div>

  <a class="btn" href="index.html">
    View website
  </a>
</header>


<!-- COMPANY -->

<div class="card">

  <span class="badge">
    Company details
  </span>

  <h2>
    Company information
  </h2>

  <div class="grid">

    <label>
      WhatsApp number

      <input
        id="wa"
        value="201010575983">
    </label>

    <label>
      Email

      <input
        id="email"
        value="ziade642@gmail.com">
    </label>

  </div>

</div>


<!-- TRIPS -->

<div id="trips">

  <div class="card loading">
    Loading trips...
  </div>

</div>


<!-- SAVE -->

<div class="card">

  <h2>
    Save changes
  </h2>

  <p class="note">
    Trip changes are saved directly to the online database.
  </p>

  <div class="actions">

    <button
      id="saveBtn"
      class="btn primary"
      type="button"
      onclick="saveAll()">
      Save changes
    </button>

    <button
      class="btn"
      type="button"
      onclick="loadTrips()">
      Reload trips
    </button>

  </div>

  <div id="status"></div>

</div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://vlqzmqbshqxycwgiuov.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2kdCMej4UhbTlmEcrqIoRg_nDGXvSeL";


/* ================================
   HELPERS
================================ */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/*
  Show a readable message.
*/

function showStatus(message,type=""){

  const status =
    document.getElementById("status");

  status.textContent = message;

  status.className = type;

}


/* ================================
   LOAD TRIPS
================================ */

async function loadTrips(){

  const box =
    document.getElementById("trips");

  showStatus("");

  box.innerHTML =
    '<div class="card loading">Loading trips...</div>';

  try{

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/trips?select=*&order=id.asc`,
      {
        method:"GET",

        headers:{
          apikey:SUPABASE_KEY,
          Authorization:`Bearer ${SUPABASE_KEY}`
        }
      }
    );


    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(
        `Load failed (${response.status}): ${errorText}`
      );

    }


    const rows =
      await response.json();


    if(!Array.isArray(rows)){

      throw new Error(
        "Supabase returned an unexpected response."
      );

    }


    if(rows.length === 0){

      box.innerHTML =
        '<div class="card loading">No trips found.</div>';

      return;

    }


    renderTrips(rows);


  }catch(error){

    console.error(error);

    box.innerHTML = `

      <div class="card">

        <h2>
          Could not load trips
        </h2>

        <p class="note">
          ${escapeHtml(error.message)}
        </p>

      </div>

    `;

    showStatus(
      "Could not load trips.",
      "error"
    );

  }

}


/* ================================
   DISPLAY TRIPS
================================ */

function renderTrips(rows){

  const box =
    document.getElementById("trips");


  box.innerHTML = rows.map(trip => `

    <div class="card">

      <span class="badge">
        Trip ID: ${escapeHtml(trip.id)}
      </span>


      <h2>
        ${escapeHtml(
          trip.title_en ||
          trip.title_ar ||
          "Trip"
        )}
      </h2>


      <div class="grid">


        <!-- ENGLISH TITLE -->

        <label>

          English title

          <input
            data-id="${escapeHtml(trip.id)}"
            data-field="title_en"
            value="${escapeHtml(trip.title_en)}">

        </label>


        <!-- ARABIC TITLE -->

        <label>

          Arabic title

          <input
            dir="rtl"
            data-id="${escapeHtml(trip.id)}"
            data-field="title_ar"
            value="${escapeHtml(trip.title_ar)}">

        </label>


        <!-- ENGLISH PRICE -->

        <label class="price">

          <strong>
            English price
          </strong>

          <input
            type="text"
            inputmode="decimal"
            data-id="${escapeHtml(trip.id)}"
            data-field="price_en"
            value="${escapeHtml(trip.price_en)}">

        </label>


        <!-- ARABIC PRICE -->

        <label class="price">

          <strong>
            Arabic price
          </strong>

          <input
            dir="rtl"
            type="text"
            inputmode="decimal"
            data-id="${escapeHtml(trip.id)}"
            data-field="price_ar"
            value="${escapeHtml(trip.price_ar)}">

        </label>


        <!-- ENGLISH IMAGE -->

        <label>

          English image URL

          <input
            data-id="${escapeHtml(trip.id)}"
            data-field="image_en"
            value="${escapeHtml(trip.image_en)}">

        </label>


        <!-- ARABIC IMAGE -->

        <label>

          Arabic image URL

          <input
            dir="rtl"
            data-id="${escapeHtml(trip.id)}"
            data-field="image_ar"
            value="${escapeHtml(trip.image_ar)}">

        </label>


        <!-- ENGLISH DESCRIPTION -->

        <label style="grid-column:1/-1">

          English description

          <textarea
            data-id="${escapeHtml(trip.id)}"
            data-field="description_en">${escapeHtml(trip.description_en)}</textarea>

        </label>


        <!-- ARABIC DESCRIPTION -->

        <label style="grid-column:1/-1">

          Arabic description

          <textarea
            dir="rtl"
            data-id="${escapeHtml(trip.id)}"
            data-field="description_ar">${escapeHtml(trip.description_ar)}</textarea>

        </label>


      </div>

    </div>

  `).join("");

}


/* ================================
   SAVE ALL TRIPS
================================ */

async function saveAll(){

  const button =
    document.getElementById("saveBtn");


  button.disabled = true;


  showStatus(
    "Saving changes..."
  );


  const updates = {};


  document
    .querySelectorAll("[data-id][data-field]")
    .forEach(input => {

      const id =
        input.dataset.id;

      const field =
        input.dataset.field;


      if(!updates[id]){

        updates[id] = {};

      }


      let value =
        input.value.trim();


      /*
        Keep prices as numbers when possible.
        This works if Supabase price columns are numeric.
      */

      if(
        field === "price_en" ||
        field === "price_ar"
      ){

        if(value !== ""){

          const numberValue =
            Number(value);

          if(!Number.isNaN(numberValue)){

            value = numberValue;

          }

        }

      }


      updates[id][field] =
        value;

    });


  try{


    const ids =
      Object.keys(updates);


    if(ids.length === 0){

      showStatus(
        "There are no changes to save."
      );

      button.disabled = false;

      return;

    }


    /*
      Update each trip separately.
    */

    for(const id of ids){

      const response =
        await fetch(
          `${SUPABASE_URL}/rest/v1/trips?id=eq.${encodeURIComponent(id)}`,
          {
            method:"PATCH",

            headers:{
              apikey:SUPABASE_KEY,
              Authorization:`Bearer ${SUPABASE_KEY}`,
              "Content-Type":"application/json",
              Prefer:"return=representation"
            },

            body:
              JSON.stringify(updates[id])
          }
        );


      if(!response.ok){

        const errorText =
          await response.text();


        throw new Error(
          `Trip ${id} (${response.status}): ${errorText}`
        );

      }

    }


    /*
      Save company information locally.
    */

    localStorage.setItem(
      "nct_company",
      JSON.stringify({

        wa:
          document.getElementById("wa").value.trim(),

        email:
          document.getElementById("email").value.trim()

      })
    );


    showStatus(
      "All changes saved successfully ✓",
      "success"
    );


    /*
      Reload from Supabase so we know
      the new values really exist there.
    */

    await loadTrips();


    showStatus(
      "All changes saved successfully ✓",
      "success"
    );


  }catch(error){

    console.error(error);


    showStatus(
      "Save failed: " + error.message,
      "error"
    );

  }


  button.disabled = false;

}


/* ================================
   COMPANY DATA
================================ */

function loadCompany(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem("nct_company") || "null"
      );


    if(!saved)
      return;


    if(saved.wa){

      document.getElementById("wa").value =
        saved.wa;

    }


    if(saved.email){

      document.getElementById("email").value =
        saved.email;

    }


  }catch(error){

    console.error(
      "Company data error:",
      error
    );

  }

}


/* ================================
   START
================================ */

loadCompany();

loadTrips();

</script>

</body>
</html>
