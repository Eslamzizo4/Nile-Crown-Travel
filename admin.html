<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nile Crown Travel - Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5efe3;
  color:#17211d;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:1100px;
  margin:40px auto;
  padding:20px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

h1{font-size:40px;margin:5px 0}
h2{margin-top:0}

.kicker{
  font-size:13px;
  font-weight:bold;
  letter-spacing:2px;
  color:#8d7040;
  text-transform:uppercase;
}

.card{
  background:#fffdf8;
  border:1px solid #d7c8aa;
  border-radius:18px;
  padding:24px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

label{
  font-size:14px;
  color:#555;
}

input,textarea{
  display:block;
  width:100%;
  margin-top:7px;
  padding:13px;
  border:1px solid #d7c8aa;
  border-radius:10px;
  font:inherit;
  background:white;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.price input{
  border:2px solid #b99b55;
  background:#fffaf0;
  font-weight:bold;
}

.btn{
  padding:12px 20px;
  border-radius:10px;
  border:1px solid #d7c8aa;
  background:#fffdf8;
  cursor:pointer;
  text-decoration:none;
  color:#17211d;
}

.primary{
  background:#1d3028;
  color:white;
  border-color:#1d3028;
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:18px;
}

.note{
  color:#666;
  font-size:14px;
  line-height:1.6;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#eee6d5;
  font-size:12px;
  font-weight:bold;
}

#status{
  margin-top:15px;
  font-weight:bold;
}

.loading{
  text-align:center;
  color:#666;
}

@media(max-width:700px){
  header{
    flex-direction:column;
    align-items:flex-start;
    gap:15px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  h1{font-size:32px}
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div>
    <div class="kicker">Nile Crown Travel</div>
    <h1>Admin Dashboard</h1>
    <p class="note">
      Edit your trips and prices, then press Save changes.
    </p>
  </div>

  <a class="btn" href="index.html">View website</a>
</header>


<!-- COMPANY -->

<div class="card">

  <span class="badge">Company details</span>

  <h2>Company information</h2>

  <div class="grid">

    <label>
      WhatsApp number
      <input id="wa" value="201010575983">
    </label>

    <label>
      Email
      <input id="email" value="ziade642@gmail.com">
    </label>

  </div>

</div>


<!-- TRIPS -->

<div id="trips">
  <div class="card loading">
    Loading trips...
  </div>
</div>


<!-- SAVE -->

<div class="card">

  <h2>Save changes</h2>

  <p class="note">
    Changes are saved directly to the online database.
  </p>

  <div class="actions">

    <button
      id="saveBtn"
      class="btn primary"
      onclick="saveAll()">
      Save changes
    </button>

    <button
      class="btn"
      onclick="loadTrips()">
      Reload trips
    </button>

  </div>

  <div id="status"></div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://vlqzmqbshqxycwgiuov.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2kdCMej4UhbTlmEcrqIoRg_nDGXvSeL";


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* LOAD TRIPS */

async function loadTrips(){

  const box =
    document.getElementById("trips");

  const status =
    document.getElementById("status");

  box.innerHTML =
  '<div class="card loading">Loading trips...</div>';

  status.textContent = "";

  try{

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/trips?select=*&order=id.asc`,
      {
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:`Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }

    const rows =
      await response.json();

    if(!rows.length){

      box.innerHTML =
      '<div class="card loading">No trips found.</div>';

      return;
    }

    renderTrips(rows);

  }catch(error){

    console.error(error);

    box.innerHTML = `
      <div class="card">
        <h2>Could not load trips</h2>
        <p class="note">
          ${escapeHtml(error.message)}
        </p>
      </div>
    `;

  }

}


/* DISPLAY TRIPS */

function renderTrips(rows){

  document.getElementById("trips").innerHTML =
  rows.map(trip => `

    <div class="card">

      <span class="badge">
        Trip ID: ${escapeHtml(trip.id)}
      </span>

      <h2>
        ${escapeHtml(
          trip.title_en ||
          trip.title_ar ||
          "Trip"
        )}
      </h2>

      <div class="grid">

        <label>
          English title
          <input
            data-id="${trip.id}"
            data-field="title_en"
            value="${escapeHtml(trip.title_en)}">
        </label>

        <label>
          Arabic title
          <input
            dir="rtl"
            data-id="${trip.id}"
            data-field="title_ar"
            value="${escapeHtml(trip.title_ar)}">
        </label>

        <label class="price">
          <strong>English price</strong>
          <input
            data-id="${trip.id}"
            data-field="price_en"
            value="${escapeHtml(trip.price_en)}">
        </label>

        <label class="price">
          <strong>Arabic price</strong>
          <input
            dir="rtl"
            data-id="${trip.id}"
            data-field="price_ar"
            value="${escapeHtml(trip.price_ar)}">
        </label>

        <label>
          English image URL
          <input
            data-id="${trip.id}"
            data-field="image_en"
            value="${escapeHtml(trip.image_en)}">
        </label>

        <label>
          Arabic image URL
          <input
            dir="rtl"
            data-id="${trip.id}"
            data-field="image_ar"
            value="${escapeHtml(trip.image_ar)}">
        </label>

        <label style="grid-column:1/-1">
          English description
          <textarea
            data-id="${trip.id}"
            data-field="description_en">${escapeHtml(trip.description_en)}</textarea>
        </label>

        <label style="grid-column:1/-1">
          Arabic description
          <textarea
            dir="rtl"
            data-id="${trip.id}"
            data-field="description_ar">${escapeHtml(trip.description_ar)}</textarea>
        </label>

      </div>

    </div>

  `).join("");

}


/* SAVE */

async function saveAll(){

  const button =
    document.getElementById("saveBtn");

  const status =
    document.getElementById("status");

  button.disabled = true;

  status.textContent =
    "Saving changes...";

  status.style.color = "";


  const updates = {};


  document
    .querySelectorAll("[data-id][data-field]")
    .forEach(input => {

      const id =
        input.dataset.id;

      const field =
        input.dataset.field;

      if(!updates[id]){
        updates[id] = {};
      }

      updates[id][field] =
        input.value;

    });


  try{

    for(const id of Object.keys(updates)){

      const response =
        await fetch(
          `${SUPABASE_URL}/rest/v1/trips?id=eq.${encodeURIComponent(id)}`,
          {
            method:"PATCH",

            headers:{
              apikey:SUPABASE_KEY,
              Authorization:`Bearer ${SUPABASE_KEY}`,
              "Content-Type":"application/json",
              Prefer:"return=minimal"
            },

            body:
              JSON.stringify(updates[id])
          }
        );


      if(!response.ok){

        throw new Error(
          `Trip ${id}: ${await response.text()}`
        );

      }

    }


    localStorage.setItem(
      "nct_company",
      JSON.stringify({
        wa:document.getElementById("wa").value,
        email:document.getElementById("email").value
      })
    );


    status.textContent =
      "Saved successfully ✓";

    status.style.color =
      "green";


  }catch(error){

    console.error(error);

    status.textContent =
      "Save failed: " + error.message;

    status.style.color =
      "red";

  }


  button.disabled = false;

}


/* COMPANY DATA */

function loadCompany(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem("nct_company") || "null"
      );

    if(saved){

      if(saved.wa)
        document.getElementById("wa").value =
          saved.wa;

      if(saved.email)
        document.getElementById("email").value =
          saved.email;

    }

  }catch(error){

    console.log(error);

  }

}


/* START */

loadCompany();
loadTrips();

</script>

</body>
</html>
