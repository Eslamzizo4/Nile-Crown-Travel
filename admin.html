<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nile Crown Travel — Admin</title>
<link rel="stylesheet" href="style.css">

<style>
body{
  background:#f5efe3;
  color:#17211d;
  font-family:Arial,sans-serif;
}

.admin-wrap{
  max-width:1050px;
  margin:40px auto;
  padding:0 20px;
}

.admin-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.admin-head h1{
  margin:4px 0 0;
  font-size:42px;
}

.admin-card{
  background:#fffdf8;
  border:1px solid #d7c8aa;
  border-radius:18px;
  padding:24px;
  margin-bottom:20px;
}

.admin-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.admin-card input,
.admin-card textarea{
  width:100%;
  box-sizing:border-box;
  margin-top:7px;
  padding:12px;
  border:1px solid #d7c8aa;
  border-radius:10px;
  font:inherit;
}

.admin-card textarea{
  min-height:110px;
}

.admin-card label{
  font-size:14px;
  color:#4e514c;
}

.price-field input{
  border:2px solid #b99b55;
  background:#fffaf0;
}

.price-field strong{
  color:#1d3028;
}

.admin-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:18px;
}

.btn{
  display:inline-block;
  padding:11px 18px;
  border-radius:10px;
  border:1px solid #d7c8aa;
  text-decoration:none;
  cursor:pointer;
  background:#fffdf8;
  color:#17211d;
}

.btn-primary{
  background:#1d3028;
  color:white;
  border-color:#1d3028;
}

.note{
  font-size:14px;
  color:#666;
  line-height:1.6;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  background:#eee6d5;
  color:#1d3028;
  font-size:12px;
  font-weight:700;
}

@media(max-width:700px){
  .admin-grid{
    grid-template-columns:1fr;
  }

  .admin-head{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<div class="admin-wrap">

  <div class="admin-head">
    <div>
      <div class="section-kicker">Nile Crown Travel</div>
      <h1>Admin Dashboard</h1>
      <p class="note">
        Edit your trips below — especially the prices — then tap Save changes.
      </p>
    </div>

    <a class="btn" href="index.html">View website</a>
  </div>


  <div class="admin-card">

    <span class="badge">Online editor</span>

    <h2>Company details</h2>

    <div class="admin-grid">

      <label>
        WhatsApp number
        <input id="wa" value="201010575983">
      </label>

      <label>
        Email
        <input id="email" value="ziade642@gmail.com">
      </label>

    </div>

  </div>


  <div id="trips"></div>


  <div class="admin-card">

    <h2>Save changes</h2>

    <p class="note">
      Changes to trips and prices are saved directly to the online database.
    </p>

    <div class="admin-actions">

      <button class="btn btn-primary" onclick="saveAll()">
        Save changes
      </button>

      <button class="btn" onclick="resetAll()">
        Reload trips
      </button>

    </div>

    <p id="status" class="note"></p>

  </div>

</div>


<script src="trip.js"></script>

<script>

const SUPABASE_URL =
  "https://vlqzmqbshqxycwgiuov.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2kdCMej4UhbTlmEcrqIoRg_nDGXvSeL";


const ids = [
  "luxor",
  "cruise",
  "cairo",
  "redsea"
];


function databaseId(id){

  if(id === "luxor"){
    return 1;
  }

  return Number(id);
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function render(){

  document.getElementById("trips").innerHTML =
    ids.map(id => {

      const trip =
        trips[id] || {};

      const en =
        trip.en || {};

      const ar =
        trip.ar || {};

      return `

      <div class="admin-card">

        <h2>
          ${escapeHtml(en.title || id)}
        </h2>

        <div class="admin-grid">

          <label>
            English title
            <input
              data-k="${id}.en.title"
              value="${escapeHtml(en.title || "")}"
            >
          </label>


          <label>
            Arabic title
            <input
              dir="rtl"
              data-k="${id}.ar.title"
              value="${escapeHtml(ar.title || "")}"
            >
          </label>


          <label class="price-field">

            <strong>English price</strong>

            <input
              data-k="${id}.en.price"
              value="${escapeHtml(en.price || "")}"
            >

          </label>


          <label class="price-field">

            <strong>Arabic price</strong>

            <input
              dir="rtl"
              data-k="${id}.ar.price"
              value="${escapeHtml(ar.price || "")}"
            >

          </label>


          <label>

            English image URL

            <input
              data-k="${id}.en.image"
              value="${escapeHtml(en.image || "")}"
            >

          </label>


          <label>

            Arabic image URL

            <input
              dir="rtl"
              data-k="${id}.ar.image"
              value="${escapeHtml(ar.image || "")}"
            >

          </label>


          <label style="grid-column:1/-1">

            English description

            <textarea
              data-k="${id}.en.desc"
            >${escapeHtml(en.desc || "")}</textarea>

          </label>


          <label style="grid-column:1/-1">

            Arabic description

            <textarea
              dir="rtl"
              data-k="${id}.ar.desc"
            >${escapeHtml(ar.desc || "")}</textarea>

          </label>

        </div>

      </div>

      `;

    }).join("");

}


async function saveAll(){

  const status =
    document.getElementById("status");

  status.textContent =
    "Saving changes...";

  status.style.color = "";


  const updates = {};


  document
    .querySelectorAll("[data-k]")
    .forEach(el => {

      const parts =
        el.dataset.k.split(".");

      const id =
        parts[0];

      const lang =
        parts[1];

      const key =
        parts[2];


      if(!updates[id]){
        updates[id] = {};
      }

      if(!updates[id][lang]){
        updates[id][lang] = {};
      }

      updates[id][lang][key] =
        el.value;

    });


  try{

    for(const id of Object.keys(updates)){

      const dbId =
        databaseId(id);


      const data = {};


      if(updates[id].en){

        if(
          updates[id].en.title !== undefined
        ){
          data.title_en =
            updates[id].en.title;
        }

        if(
          updates[id].en.price !== undefined
        ){
          data.price_en =
            updates[id].en.price;
        }

        if(
          updates[id].en.image !== undefined
        ){
          data.image_en =
            updates[id].en.image;
        }

        if(
          updates[id].en.desc !== undefined
        ){
          data.description_en =
            updates[id].en.desc;
        }

      }


      if(updates[id].ar){

        if(
          updates[id].ar.title !== undefined
        ){
          data.title_ar =
            updates[id].ar.title;
        }

        if(
          updates[id].ar.price !== undefined
        ){
          data.price_ar =
            updates[id].ar.price;
        }

        if(
          updates[id].ar.image !== undefined
        ){
          data.image_ar =
            updates[id].ar.image;
        }

        if(
          updates[id].ar.desc !== undefined
        ){
          data.description_ar =
            updates[id].ar.desc;
        }

      }


      const response =
        await fetch(
          `${SUPABASE_URL}/rest/v1/trips?id=eq.${dbId}`,
          {
            method:"PATCH",

            headers:{
              apikey:SUPABASE_KEY,
              Authorization:
                `Bearer ${SUPABASE_KEY}`,
              "Content-Type":
                "application/json",
              Prefer:
                "return=minimal"
            },

            body:
              JSON.stringify(data)
          }
        );


      if(!response.ok){

        const errorText =
          await response.text();

        throw new Error(errorText);

      }

    }


    localStorage.setItem(
      "nct_company",
      JSON.stringify({
        wa:
          document.getElementById("wa").value,

        email:
          document.getElementById("email").value
      })
    );


    status.textContent =
      "Saved successfully ✓";

    status.style.color =
      "green";


  }catch(error){

    console.error(error);

    status.textContent =
      "Save failed: " + error.message;

    status.style.color =
      "red";

  }

}


function resetAll(){

  location.reload();

}


render();

</script>

</body>
</html>
